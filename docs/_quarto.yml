format:
  html:
    theme:
      light: [cosmo, styles.css]
      dark: [cosmo, styles-dark.css]
    toc: true
    toc-depth: 3
    include-in-header:
      - gtag.txt
    code-copy: true
    code-fold: false
    code-tools:
      source: true
      toggle: false
      caption: none
    number-sections: false
    link-external-newwindow: true
    link-external-icon: true
    smooth-scroll: true
    fig-width: 8
    fig-height: 6
    fig-dpi: 300

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  eval: true
