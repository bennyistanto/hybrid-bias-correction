project:
  type: website
  output-dir: ../_site
  render:
    - "*.qmd"
    - "example-bali/*.ipynb"
    - "!_legacy/"

website:
  title: "Hybrid Bias Correction"
  description: "Values, Distributions, Extremes - with Neural Refinement. A Python framework for daily satellite precipitation bias correction."
  favicon: images/favicon.png
  site-url: https://bennyistanto.github.io/hybrid-bias-correction
  repo-url: https://github.com/bennyistanto/hybrid-bias-correction
  repo-actions: [source, issue]
  bread-crumbs: true
  back-to-top-navigation: true
  page-navigation: true
  google-analytics: "G-DY86PR709K"

  navbar:
    background: primary
    logo: images/lseqmdl-logo-dark-background.png
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Get Started"
        menu:
          - text: "Installation"
            href: get-started/installation.qmd
          - text: "Quickstart"
            href: get-started/quick-start.qmd
          - text: "Configuration"
            href: get-started/configuration.qmd
          - text: "Data Model"
            href: get-started/data-model.qmd
      - text: "Tutorials"
        menu:
          - text: "Data Preparation"
            href: tutorials/data-preparation.qmd
          - text: "Full Pipeline"
            href: tutorials/full-pipeline.qmd
          - text: "QA Framework"
            href: tutorials/qa-framework.qmd
          - text: "Station Validation"
            href: tutorials/station-validation.qmd
      - text: "Case Studies"
        menu:
          - text: "Overview"
            href: case-studies/index.qmd
          - text: "Reading the Results"
            href: case-studies/reading-the-results.qmd
          - text: "---"
          - text: "Indonesia"
            href: case-studies/indonesia.qmd
          - text: "Bali Example (executed notebooks)"
            href: example-bali/index.qmd
          - text: "---"
          - text: "Interactive Dashboard"
            href: https://bennyistanto.github.io/hybrid-bias-correction/viz/
      - text: "Documentation"
        menu:
          - text: "Methodology"
            href: methodology/index.qmd
          - text: "Implementation"
            href: implementation/index.qmd
          - text: "User Guide"
            href: user-guide/index.qmd
          - text: "---"
          - text: "Architecture"
            href: technical/architecture.qmd
          - text: "API Reference"
            href: technical/api-reference/index.qmd
          - text: "Validation"
            href: technical/validation.qmd
          - text: "Sensitivity Analysis"
            href: technical/sensitivity-analysis.qmd
          - text: "Testing"
            href: technical/testing.qmd
          - text: "CF Compliance"
            href: technical/cf-compliance.qmd
      - text: "About"
