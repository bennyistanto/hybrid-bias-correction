# =============================================================================
# Hybrid Bias Correction - Conda/Mamba Environment
# =============================================================================
#
# Create a new environment:
#   mamba env create -f environment.yml
#   mamba activate climate
#
# Update an existing 'climate' env after changes:
#   mamba env update -f environment.yml --prune
#
# Register as Jupyter kernel (once):
#   python -m ipykernel install --user --name climate --display-name "Python (climate)"
#
# Tested with Python 3.10-3.12 (recommended: 3.12).
# =============================================================================

name: climate

channels:
  - conda-forge
  - defaults

dependencies:
  # -------------------------------------------------------------------------
  # Python
  # -------------------------------------------------------------------------
  - python>=3.10,<3.13

  # -------------------------------------------------------------------------
  # Core scientific stack
  # -------------------------------------------------------------------------
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - xarray>=2023.1
  - dask>=2023.1

  # -------------------------------------------------------------------------
  # NetCDF / climate data I/O
  # -------------------------------------------------------------------------
  - netcdf4>=1.6
  - h5netcdf>=1.1
  - cfgrib>=0.9
  - pyyaml>=6.0
  - cftime>=1.6

  # -------------------------------------------------------------------------
  # Geospatial data processing
  # -------------------------------------------------------------------------
  - rasterio>=1.3
  - geopandas>=0.13
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.5
  - regionmask>=0.10

  # -------------------------------------------------------------------------
  # Regridding (xesmf needs ESMPy, only on conda-forge)
  # -------------------------------------------------------------------------
  - xesmf>=0.8
  - esmpy>=8.4

  # -------------------------------------------------------------------------
  # Machine learning
  # -------------------------------------------------------------------------
  - scikit-learn>=1.2

  # -------------------------------------------------------------------------
  # Deep Learning (only needed for the CNN refinement step)
  # -------------------------------------------------------------------------
  # Comment out the next line to skip TensorFlow.
  - tensorflow>=2.16

  # -------------------------------------------------------------------------
  # Visualization
  # -------------------------------------------------------------------------
  - matplotlib>=3.7
  - cartopy>=0.22
  - seaborn>=0.12
  - bokeh>=3,<4
  - cmocean>=3.0

  # -------------------------------------------------------------------------
  # NetCDF CLI tools (Python wrappers via conda)
  # -------------------------------------------------------------------------
  - nco                       # NetCDF Operators
  # - cdo                     # Climate Data Operators (Linux/macOS only)

  # -------------------------------------------------------------------------
  # Jupyter (minimal - just what's needed to run the notebooks)
  # -------------------------------------------------------------------------
  # Productivity tools (jupyterlab-git, jupyterlab-lsp, python-lsp-server,
  # jupyter-contrib-nbextensions) are intentionally not here. Install them
  # via the [dev] extras in pyproject.toml if you want them:
  #   pip install -e ".[dev]"
  - jupyterlab>=4.0
  - notebook>=7.0
  - ipykernel>=6.0
  - ipywidgets>=8.0
  - nbformat>=5.9
  - nbconvert>=7.0
  - tqdm>=4.65

  # -------------------------------------------------------------------------
  # Documentation extras (Quarto site auto-API)
  # -------------------------------------------------------------------------
  # Quarto itself is a separate binary install (https://quarto.org).
  # These two are the Python side: griffe pinned <1.0 for quartodoc 0.11
  # compatibility (see docs/changelog.qmd).
  - pip
  - pip:
      - quartodoc>=0.11,<0.12
      - griffe<1.0
