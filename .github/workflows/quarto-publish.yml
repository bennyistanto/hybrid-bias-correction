name: Publish Quarto site

# Triggers on every push to main. The cache-wipe step makes every run
# a fresh rebuild - no stale quartodoc API pages, no leftover freeze artefacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Modern Pages deployment requires id-token: write + pages: write.
# contents: read is enough because we don't push back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight build when a newer commit arrives.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    env:
      # Force UTF-8 default - quartodoc writes module pages with non-ASCII
      # characters (sigma, em-dash etc.); explicit beats implicit.
      PYTHONUTF8: "1"
      # PYTHONPATH so `quartodoc build` can import `src` from the repo root
      # while its working directory is `docs/`.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies for quartodoc
        # griffe pinned <1.0 because quartodoc 0.11 calls `parse_numpy(..., allow_section_blank_line=...)`
        # which newer griffe rejects (TypeError). See changelog notes.
        run: |
          python -m pip install --upgrade pip
          pip install "quartodoc>=0.11,<0.12" "griffe<1.0"
          # The src/ package imports xarray etc.; install runtime deps so
          # griffe's dynamic_import can resolve src.* modules.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Wipe Quarto caches (force a clean rebuild)
        run: |
          rm -rf docs/.quarto docs/_freeze _site
          echo "Caches cleared: docs/.quarto docs/_freeze _site"

      - name: Build API reference (quartodoc)
        working-directory: docs
        run: quartodoc build --config _quartodoc.yml

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
