name: Publish Quarto site

# Triggers on every push to main. The cache-wipe step below makes every run
# a fresh rebuild - no stale quartodoc API pages, no leftover freeze artefacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Cancel any in-flight build when a newer commit arrives. Saves runner minutes
# on rapid-fire pushes and avoids race conditions on the gh-pages branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      # Force UTF-8 default - quartodoc writes module pages with non-ASCII
      # characters (sigma, em-dash etc.) and Windows-style default encodings
      # would crash. Linux runners default to UTF-8 already but explicit is safer.
      PYTHONUTF8: "1"
      # PYTHONPATH so `quartodoc build` can import `src` from the repo root
      # while its working directory is `docs/`.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies for quartodoc
        # griffe pinned <1.0 because quartodoc 0.11 calls `parse_numpy(..., allow_section_blank_line=...)`
        # which newer griffe rejects (TypeError). See changelog notes.
        run: |
          python -m pip install --upgrade pip
          pip install "quartodoc>=0.11,<0.12" "griffe<1.0"
          # The src/ package imports xarray etc.; install runtime deps so
          # griffe's dynamic_import can resolve src.* modules.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Wipe Quarto caches (force a clean rebuild)
        run: |
          rm -rf docs/.quarto docs/_freeze _site
          echo "Caches cleared: docs/.quarto docs/_freeze _site"

      - name: Build API reference (quartodoc)
        working-directory: docs
        run: quartodoc build --config _quartodoc.yml

      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          # force_orphan replaces the gh-pages branch contents on every deploy.
          # No accumulated history on the published branch, smaller clone size.
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: publish ${{ github.sha }}"
